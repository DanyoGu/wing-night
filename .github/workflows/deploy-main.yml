name: Deploy main to Hot Ones

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hotones-main-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test backend and browser behavior
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -q
          for test in tests/*.cjs; do node "$test"; done
      - name: Identify and build exact main revision
        id: build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          count="$(git rev-list --count HEAD)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Deploying v0.$count from full-history main SHA $GITHUB_SHA"
          docker build --pull --build-arg WING_REVISION="$GITHUB_SHA" --build-arg WING_COMMIT_COUNT="$count" -t "wing-night:$GITHUB_SHA" .
          docker run --rm --network none --read-only --entrypoint python "wing-night:$GITHUB_SHA" -c "import json; r=json.load(open('/app/release.json')); assert r['revision']=='$GITHUB_SHA' and r['version']=='v0.$count'; print(r)"
          docker save "wing-night:$GITHUB_SHA" | gzip > image.tgz
          echo "checksum=$(sha256sum image.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Azure using repo/main OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy only the latest main to the existing event VM
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_COUNT: ${{ steps.build.outputs.count }}
          ARTIFACT_SHA256: ${{ steps.build.outputs.checksum }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo "Superseded main revision: no production switch."
            exit 0
          fi
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-09T13:00:00Z' +%s)"
          VM_ID="$(az vm show -g rg-hotones-event -n vm-hotones --query id -o tsv)"
          export VM_ID
          az storage blob upload --auth-mode login --account-name sthotones20261106 --container-name releases --name "$GITHUB_SHA/image.tgz" --file image.tgz --overwrite --only-show-errors -o none
          python - <<'PY'
          import json, os
          script = (f"set -eu\n# GitHub run {os.environ['GITHUB_RUN_ID']} attempt {os.environ['GITHUB_RUN_ATTEMPT']}\n"
                    f"timeout 600 python3 /usr/local/sbin/wing-release {os.environ['GITHUB_SHA']} {os.environ['COMMIT_COUNT']} {os.environ['ARTIFACT_SHA256']}\n")
          json.dump({"location": "eastus", "tags": {"managedBy": "wing-night-deployment", "event": "2026-11-08"},
                     "properties": {"source": {"script": script}, "asyncExecution": True, "timeoutInSeconds": 720}},
                    open("command.json", "w"))
          PY
          export RELEASE_REQUESTED_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          az rest --method put --uri "$VM_ID/runCommands/hotones-main-release?api-version=2024-11-01" --body @command.json -o none
          python - <<'PY'
          import json, os, subprocess, time, urllib.request
          from datetime import datetime
          uri = os.environ["VM_ID"] + "/runCommands/hotones-main-release?api-version=2024-11-01&%24expand=instanceView"
          requested = datetime.fromisoformat(os.environ["RELEASE_REQUESTED_UTC"].replace("Z", "+00:00"))
          for attempt in range(90):
              status = subprocess.run(["az", "rest", "--method", "get", "--uri", uri, "-o", "json"], text=True, capture_output=True)
              if status.returncode:
                  if "ResourceNotFound" not in status.stderr:
                      raise SystemExit("VM release status query failed: " + status.stderr)
                  print("Waiting for managed release command registration.", flush=True)
              else:
                  command = json.loads(status.stdout)
                  view = command.get("properties", {}).get("instanceView", {})
                  started = view.get("startTime")
                  if started and datetime.fromisoformat(started.replace("Z", "+00:00")) >= requested:
                      state = view.get("executionState")
                      if state in ("Failed", "TimedOut", "Canceled"):
                          raise SystemExit("VM release failed: " + json.dumps(view))
                      if state == "Succeeded":
                          if view.get("exitCode") != 0 or view.get("error"):
                              raise SystemExit("VM release reported an error: " + json.dumps(view))
                          json.dump(command, open("deployment.json", "w"), indent=2)
                          print("VM release result:", json.dumps(view), flush=True)
                          break
                  print("Waiting for this release's bounded VM execution.", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for the managed VM release; inspect its instance view before retrying.")
          expected = {"version": "v0." + os.environ["COMMIT_COUNT"], "revision": os.environ["GITHUB_SHA"], "commit_count": int(os.environ["COMMIT_COUNT"])}
          with urllib.request.urlopen("https://hotones.alvinli.work/api/version", timeout=20) as response:
              actual = json.load(response)
          if actual != expected:
              raise SystemExit(f"Production version mismatch: expected {expected}, got {actual}")
          with urllib.request.urlopen("https://hotones.alvinli.work/", timeout=20) as response:
              assert response.status == 200
          print("Verified running production release:", actual)
          PY
