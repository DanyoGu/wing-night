name: Deploy main to Hot Ones

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hotones-main-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test backend and browser behavior
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -q
          for test in tests/*.cjs; do node "$test"; done
      - name: Identify and build exact main revision
        id: build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          count="$(git rev-list --count HEAD)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Deploying v0.$count from full-history main SHA $GITHUB_SHA"
          docker build --pull --build-arg WING_REVISION="$GITHUB_SHA" --build-arg WING_COMMIT_COUNT="$count" -t "wing-night:$GITHUB_SHA" .
          docker run --rm --network none --read-only --entrypoint python "wing-night:$GITHUB_SHA" -c "import json; r=json.load(open('/app/release.json')); assert r['revision']=='$GITHUB_SHA' and r['version']=='v0.$count'; print(r)"
          docker save "wing-night:$GITHUB_SHA" | gzip > image.tgz
          echo "checksum=$(sha256sum image.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Azure using repo/main OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy only the latest main to the existing event VM
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_COUNT: ${{ steps.build.outputs.count }}
          ARTIFACT_SHA256: ${{ steps.build.outputs.checksum }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo "Superseded main revision: no production switch."
            exit 0
          fi
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-09T13:00:00Z' +%s)"
          az vm show -g rg-hotones-event -n vm-hotones --query id -o tsv
          az storage blob upload --auth-mode login --account-name sthotones20261106 --container-name releases --name "$GITHUB_SHA/image.tgz" --file image.tgz --overwrite --only-show-errors -o none
          az vm run-command invoke -g rg-hotones-event -n vm-hotones --command-id RunShellScript --scripts "set -eu; timeout 600 python3 /usr/local/sbin/wing-release $GITHUB_SHA $COMMIT_COUNT $ARTIFACT_SHA256" --only-show-errors -o json > deployment.json
          cat deployment.json
          python - <<'PY'
          import json, os, sys, urllib.request
          for item in json.load(open("deployment.json"))["value"]:
              stderr = item["message"].partition("[stderr]")[2].strip()
              if stderr:
                  raise SystemExit("VM release reported an error: " + stderr)
          expected = {"version": "v0." + os.environ["COMMIT_COUNT"], "revision": os.environ["GITHUB_SHA"], "commit_count": int(os.environ["COMMIT_COUNT"])}
          with urllib.request.urlopen("https://hotones.alvinli.work/api/version", timeout=20) as response:
              actual = json.load(response)
          if actual != expected:
              raise SystemExit(f"Production version mismatch: expected {expected}, got {actual}")
          with urllib.request.urlopen("https://hotones.alvinli.work/", timeout=20) as response:
              assert response.status == 200
          print("Verified running production release:", actual)
          PY
